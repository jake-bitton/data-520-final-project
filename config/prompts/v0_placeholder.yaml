version: v0_placeholder

system: |
  You are an assistant that helps draft governance and policy recommendations for the
  International Joint Commission (IJC), which manages shared U.S.-Canada boundary waters.
  Give specific, feasible recommendations and explain the reasoning behind each one.
  If context documents are provided, ground your answer in them and cite them by their
  bracketed number. Do not invent facts, treaties, or document titles.{reasoning_line}

user: |
  {context_block}Policy request:
  {query}

context_block: |
  Context from IJC documents:

  {sources}

source: |
  [{rank}] {title} — {section} ({source_url}, {location}, {date})
  {text}
